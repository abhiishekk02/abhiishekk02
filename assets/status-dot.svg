<svg width="168" height="32" viewBox="0 0 168 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pill { fill: #0d1117; stroke: rgba(255,77,28,0.35); stroke-width: 1; }
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      fill: #c9d1d9;
      letter-spacing: 0.4px;
    }
    .dot-core { fill: #FF4D1C; }
    .dot-ring {
      fill: none;
      stroke: #FF4D1C;
      stroke-width: 1.5;
      transform-origin: 20px 16px;
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { r: 4; stroke-opacity: 0.9; }
      70%  { r: 11; stroke-opacity: 0; }
      100% { r: 11; stroke-opacity: 0; }
    }
  </style>
  <rect class="pill" x="0.5" y="0.5" width="167" height="31" rx="16" />
  <circle class="dot-ring" cx="20" cy="16" r="4" />
  <circle class="dot-core" cx="20" cy="16" r="4" />
  <text class="label" x="36" y="20">OPEN TO WORK</text>
</svg>
